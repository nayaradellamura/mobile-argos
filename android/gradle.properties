# -Xmx reduzido de 8G para 3G porque esta maquina tem ~7 GB livres; 8G de
# heap mais 4G de metaspace nao cabem. NAO tem relacao com o erro
# 'Unable to establish loopback connection' que aparece neste projeto —
# esse e um problema de SO (AF_UNIX indisponivel), nao de memoria.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# org.gradle.java.home removido: era um caminho absoluto de Windows
# (C:/Program Files/Android/Android Studio/jbr), entao o projeto so
# buildava em maquina com o Android Studio exatamente ali — quebrava no
# CI Linux e em qualquer outro setup. Sem esta linha o Gradle usa o
# JAVA_HOME do ambiente, que o Android Studio tambem define.
org.gradle.caching=false
org.gradle.configuration-cache=false
org.gradle.vfs.watch=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
