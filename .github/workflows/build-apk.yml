# Build do APK no CI.
#
# Existe porque a maquina de desenvolvimento nao consegue buildar: qualquer JDK
# moderno falha nela com
#   java.io.IOException: Unable to establish loopback connection
# porque o Selector do Java cria um pipe sobre AF_UNIX e a familia AF_UNIX nao
# esta registrada no catalogo Winsock daquele Windows. Runners Linux nao tem
# esse problema.
#
# ASSINATURA: o APK e assinado com um keystore fixo, montado a partir de dois
# secrets do repositorio:
#   ANDROID_KEYSTORE_BASE64    - o arquivo .keystore em base64
#   ANDROID_KEYSTORE_PASSWORD  - a senha (store e key usam a mesma)
#
# Isso existe porque a chave de debug do runner e gerada nova a cada execucao:
# o SHA-1 mudava todo build, e o Google Sign-In falhava com
# PlatformException(sign_in_failed, ...: 10) = DEVELOPER_ERROR, ja que o SHA-1
# precisa estar registrado no Firebase. Com keystore fixo o SHA e estavel,
# basta registra-lo uma vez.
#
# Sem os secrets configurados o build ainda passa, mas cai na chave de debug e
# o login Google volta a falhar — o passo abaixo avisa quando isso acontece.

name: build-apk

on:
  push:
    branches: [main, Juan, 'feat/**']
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # Portao de qualidade: falha o build se aparecer erro de analise.
      # Warnings e infos nao derrubam (o projeto ja tem ~200 infos de
      # withOpacity depreciado, pre-existentes).
      - name: flutter analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Monta o keystore de release a partir dos secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 nao configurado — o APK sai assinado com chave de DEBUG e o Google Sign-In vai falhar (DEVELOPER_ERROR)."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/argos-release.keystore
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASS
          keyPassword=$KEYSTORE_PASS
          keyAlias=argos
          storeFile=app/argos-release.keystore
          PROPS
          echo "keystore montado ($(stat -c%s android/app/argos-release.keystore) bytes)"

      - name: flutter build apk --release
        run: flutter build apk --release

      - name: Confere com qual chave o APK foi assinado
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk             | grep -i "SHA-1" || true

      - uses: actions/upload-artifact@v4
        with:
          name: argos-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
